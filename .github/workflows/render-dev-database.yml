name: QuickFact Render development database
# Administrative diagnostics contain codes only, never raw connection errors.

on:
  push:
    branches: ['codex/base-quickfact']
    paths: ['.github/workflows/render-dev-database.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickfact-render-dev-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/codex/base-quickfact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Migrate and verify the authorized development database
        working-directory: apps/api
        run: node scripts/migrate-render-dev.mjs
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
