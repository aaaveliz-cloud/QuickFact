name: QuickFact checks

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quickfact_test
          POSTGRES_PASSWORD: ephemeral-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Synthetic credentials for this disposable CI container; never a real service.
      MIGRATION_DATABASE_URL: postgresql://postgres:ephemeral-ci-test-only@localhost:5432/quickfact_test
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-test-only@localhost:5432/quickfact_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node apps/api/scripts/prepare-ci-migration-role.mjs
      - run: pnpm --filter @quickfact/api db:deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://quickfact_test_migrator:ephemeral-migration-test-only@localhost:5432/quickfact_test
      - run: pnpm --filter @quickfact/api test:db
      - run: pnpm audit --prod
